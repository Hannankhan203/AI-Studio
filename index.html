<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Orvix</title>
    <meta name="description" content="A modern, lightweight AI chatbot web application." />
    <meta property="og:title" content="Orvix" />
    <meta property="og:description" content="A modern, lightweight AI chatbot web application." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon & App Icon Declarations -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="application-name" content="Orvix" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orvix" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Immediate theme initialization to prevent flash on reload -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('orvix_active_theme');
          if (!theme) {
            var guestSettings = localStorage.getItem('orvix_guest_settings');
            if (guestSettings) {
              var parsed = JSON.parse(guestSettings);
              if (parsed && parsed.theme === 'light') theme = 'light';
              else if (parsed && parsed.theme === 'dark') theme = 'dark';
            }
          }
          if (!theme && window.matchMedia) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('theme-light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('theme-dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
