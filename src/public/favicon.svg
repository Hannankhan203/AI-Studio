<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="orvixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Subtle Top Highlight -->
    <linearGradient id="orvixHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b1329" flood-opacity="0.45"/>
    </filter>

    <!-- Inner Glow for Bot Head -->
    <linearGradient id="botFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#orvixBg)" filter="url(#iconShadow)"/>
  <!-- Top Surface Sheen -->
  <rect x="24" y="24" width="464" height="232" rx="116" ry="116" fill="url(#orvixHighlight)"/>
  <!-- Outer Subtle Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Orvix Bot Glyph -->
  <g id="orvix-bot-mark">
    <!-- Antenna Stem & Orb -->
    <path d="M 256 180 L 256 122" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <circle cx="256" cy="106" r="26" fill="#ffffff"/>
    <circle cx="256" cy="106" r="14" fill="#60a5fa"/>

    <!-- Left & Right Ear Nodes -->
    <rect x="76" y="260" width="32" height="64" rx="14" fill="#93c5fd"/>
    <rect x="404" y="260" width="32" height="64" rx="14" fill="#93c5fd"/>

    <!-- Robot Head Frame -->
    <rect x="98" y="176" width="316" height="232" rx="48" fill="url(#botFaceGrad)"/>

    <!-- Screen Visor Display Area -->
    <rect x="130" y="212" width="252" height="136" rx="28" fill="#0f172a"/>

    <!-- Expressive Eyes -->
    <circle cx="196" cy="272" r="24" fill="#38bdf8"/>
    <circle cx="196" cy="272" r="14" fill="#ffffff"/>

    <circle cx="316" cy="272" r="24" fill="#38bdf8"/>
    <circle cx="316" cy="272" r="14" fill="#ffffff"/>

    <!-- Friendly Smile Wave -->
    <path d="M 216 368 Q 256 388 296 368" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>

    <!-- Ambient AI Sparkle (Top Right Accent) -->
    <path d="M 390 82 Q 390 106 370 106 Q 390 106 390 130 Q 390 106 410 106 Q 390 106 390 82 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
